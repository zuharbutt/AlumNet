<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile — AlumniMS</title>
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
</head>
<body>
<div id="sidebar"></div>

<div id="main-content">
  <div id="topbar"></div>


<div class="sb-page" style="display:flex;justify-content:center;">
  <div class="form-card-wide">
    <h2 style="margin-bottom:24px;">Edit Your Profile</h2>

    <div id="error-banner" style="background:#fdecea;padding:10px 14px;border-radius:6px;margin-bottom:16px;display:none;color:#c62828;font-size:.9rem;"></div>

    <form id="profile-form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="full-name" readonly style="background:#f5f5f5;" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" readonly style="background:#f5f5f5;" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="enrollment-year">Enrollment Year *</label>
          <input type="number" id="enrollment-year" min="2000" placeholder="e.g. 2022" required />
          <div class="error-msg" id="enroll-year-error"></div>
        </div>
        <div class="form-group">
          <label for="expected-grad-year">Expected Graduation Year *</label>
          <input type="number" id="expected-grad-year" min="2000" placeholder="e.g. 2026" required />
          <div class="error-msg" id="expected-grad-error"></div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="department">Department *</label>
          <select id="department" required>
            <option value="">Select department…</option>
          </select>
          <div class="error-msg" id="dept-error"></div>
        </div>
        <div class="form-group">
          <label for="degree-program">Degree Program *</label>
          <input type="text" id="degree-program" placeholder="e.g. BS Software Engineering" required />
          <div class="error-msg" id="degree-error"></div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="current-semester">Current Semester</label>
          <input type="number" id="current-semester" min="1" max="12" placeholder="1–12" />
          <div class="error-msg" id="semester-error"></div>
        </div>
        <div class="form-group">
          <label for="cgpa">CGPA</label>
          <input type="number" id="cgpa" min="0" max="4" step="0.01" placeholder="0.00–4.00" />
          <div class="error-msg" id="cgpa-error"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="short-bio">Short Bio</label>
        <textarea id="short-bio" rows="4" placeholder="Tell us about yourself…" style="resize:vertical;"></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="save-btn">Save Changes</button>
    </form>
  </div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/guards.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/utils.js"></script>
<script>
  requireAuth(['Student']);
  renderSidebar('Edit Profile');

  const currentYear = new Date().getFullYear();

  async function loadDepartments() {
    const res = await apiFetch('/departments');
    const select = document.getElementById('department');
    (res.data || []).forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.departmentId;
      opt.textContent = d.name;
      select.appendChild(opt);
    });
  }

  async function loadProfile() {
    const res = await apiFetch('/students/me');
    const p = res.data;
    document.getElementById('full-name').value         = p.fullName               || '';
    document.getElementById('email').value             = p.email                  || '';
    document.getElementById('enrollment-year').value   = p.enrollmentYear         || '';
    document.getElementById('expected-grad-year').value= p.expectedGraduationYear || '';
    document.getElementById('department').value        = p.departmentId           || '';
    document.getElementById('degree-program').value    = p.degreeProgram          || '';
    document.getElementById('current-semester').value  = p.currentSemester        || '';
    document.getElementById('cgpa').value              = p.cgpa != null ? p.cgpa : '';
    document.getElementById('short-bio').value         = p.shortBio               || '';
  }

  Promise.all([loadDepartments(), loadProfile()]).catch(err => {
    const banner = document.getElementById('error-banner');
    banner.textContent = err.message || 'Failed to load profile.';
    banner.style.display = 'block';
  });

  document.getElementById('profile-form').addEventListener('submit', async e => {
    e.preventDefault();
    ['enroll-year-error','expected-grad-error','dept-error','degree-error','semester-error','cgpa-error'].forEach(clearError);
    const banner = document.getElementById('error-banner');
    banner.style.display = 'none';

    const enrollYear   = parseInt(document.getElementById('enrollment-year').value);
    const expectedGrad = parseInt(document.getElementById('expected-grad-year').value);
    const deptId       = parseInt(document.getElementById('department').value);
    const degree       = document.getElementById('degree-program').value.trim();
    const semVal       = document.getElementById('current-semester').value;
    const cgpaVal      = document.getElementById('cgpa').value;
    const semester     = semVal  ? parseInt(semVal)    : null;
    const cgpa         = cgpaVal ? parseFloat(cgpaVal) : null;

    let valid = true;
    if (!enrollYear || enrollYear < 2000 || enrollYear > currentYear) {
      showError('enroll-year-error', `Enrollment year must be between 2000 and ${currentYear}.`);
      valid = false;
    }
    if (!expectedGrad || expectedGrad <= enrollYear) {
      showError('expected-grad-error', 'Expected graduation year must be greater than enrollment year.');
      valid = false;
    }
    if (!deptId)  { showError('dept-error', 'Please select a department.'); valid = false; }
    if (!degree)  { showError('degree-error', 'Degree program is required.'); valid = false; }
    if (semester !== null && (semester < 1 || semester > 12)) {
      showError('semester-error', 'Semester must be between 1 and 12.'); valid = false;
    }
    if (cgpa !== null && (cgpa < 0 || cgpa > 4)) {
      showError('cgpa-error', 'CGPA must be between 0.00 and 4.00.'); valid = false;
    }
    if (!valid) return;

    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Saving…';

    try {
      await apiFetch('/students/me', {
        method: 'PUT',
        body: JSON.stringify({
          departmentId:          deptId,
          enrollmentYear:        enrollYear,
          expectedGraduationYear: expectedGrad,
          degreeProgram:         degree,
          currentSemester:       semester,
          cgpa:                  cgpa,
          shortBio:              document.getElementById('short-bio').value.trim() || null,
        })
      });
      showToast('Profile saved successfully!');
    } catch (err) {
      banner.textContent = err.message || 'Failed to save profile.';
      banner.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'Save Changes';
    }
  });
</script>
</div>
</body>
</html>
