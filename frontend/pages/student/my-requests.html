<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Mentorship Requests — AlumniMS</title>
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/sidebar.css" />
  <style>
    .tab-bar { display:flex; gap:0; border-bottom:2px solid #e0e0e0; margin-bottom:24px; }
    .tab-btn { padding:10px 22px; background:none; border:none; cursor:pointer; font-size:.95rem; color:#666; border-bottom:3px solid transparent; margin-bottom:-2px; transition:color .2s,border-color .2s; }
    .tab-btn.active { color:#1565c0; border-bottom-color:#1565c0; font-weight:600; }
    .tab-btn:hover:not(.active) { color:#333; }

    .request-card { background:#fff; border:1px solid #e0e0e0; border-radius:8px; padding:18px 20px; margin-bottom:14px; }
    .request-card .rc-header { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px; }
    .request-card .alumni-name { font-weight:600; font-size:1rem; color:#1565c0; text-decoration:none; }
    .request-card .alumni-name:hover { text-decoration:underline; }
    .request-card .rc-meta { font-size:.82rem; color:#888; margin-top:2px; }
    .request-card .rc-message { font-size:.9rem; color:#444; margin:10px 0; line-height:1.55; background:#f9f9f9; padding:10px 12px; border-radius:6px; border-left:3px solid #1565c0; }
    .request-card .rc-contact { font-size:.88rem; color:#2e7d32; margin-top:8px; }
    .request-card .rc-contact a { color:#1565c0; }

    .status-pill { display:inline-block; padding:3px 11px; border-radius:12px; font-size:.78rem; font-weight:600; }
    .pill-pending  { background:#fff3e0; color:#e65100; }
    .pill-accepted { background:#e8f5e9; color:#2e7d32; }
    .pill-rejected { background:#fce4ec; color:#b71c1c; }
    .pill-cancelled { background:#f5f5f5; color:#757575; }

    .btn-cancel { background:none; border:1px solid #e57373; color:#c62828; padding:5px 14px; border-radius:5px; font-size:.83rem; cursor:pointer; transition:background .2s; }
    .btn-cancel:hover { background:#ffebee; }

    .pagination { display:flex; gap:8px; justify-content:center; margin-top:24px; flex-wrap:wrap; }
    .page-btn { padding:6px 13px; border:1px solid #ccc; background:#fff; cursor:pointer; border-radius:5px; font-size:.88rem; }
    .page-btn.active { background:#1565c0; color:#fff; border-color:#1565c0; }
    .page-btn:hover:not(.active) { background:#f5f5f5; }
  </style>
</head>
<body>
<div id="sidebar"></div>

<div id="main-content">
  <div id="topbar"></div>


<div class="sb-page">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
    <h1 style="font-size:1.5rem;margin:0;">My Mentorship Requests</h1>
    <a href="alumni-directory.html" class="btn btn-primary" style="font-size:.88rem;padding:8px 16px;">+ Find Alumni</a>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="Pending"   onclick="switchTab('Pending')">Pending</button>
    <button class="tab-btn"        data-tab="Accepted"  onclick="switchTab('Accepted')">Accepted</button>
    <button class="tab-btn"        data-tab="Rejected"  onclick="switchTab('Rejected')">Rejected</button>
  </div>

  <div id="list-area"><div class="spinner"></div></div>
  <div class="pagination" id="pagination"></div>
</div>

<script src="../../js/config.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/guards.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/utils.js"></script>
<script>
  requireAuth(['Student']);
  renderSidebar('My Requests');

  let currentTab  = 'Pending';
  let currentPage = 1;
  const PAGE_SIZE = 10;

  loadRequests();

  function switchTab(tab) {
    currentTab  = tab;
    currentPage = 1;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    loadRequests();
  }

  async function loadRequests() {
    const area = document.getElementById('list-area');
    area.innerHTML = '<div class="spinner"></div>';
    document.getElementById('pagination').innerHTML = '';

    try {
      const res  = await apiFetch('/mentorship/sent?status=' + currentTab + '&page=' + currentPage + '&pageSize=' + PAGE_SIZE);
      const data = res.data;

      if (!data.items || data.items.length === 0) {
        area.innerHTML = '<div class="no-results">No ' + currentTab.toLowerCase() + ' requests.</div>';
        return;
      }

      area.innerHTML = data.items.map(renderCard).join('');
      renderPagination(data.totalCount);
    } catch (err) {
      area.innerHTML = '<div class="no-results" style="color:#c62828;">' + escHtml(err.message || 'Failed to load requests.') + '</div>';
    }
  }

  function renderCard(r) {
    const date = new Date(r.requestedAt).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    const pillClass = { Pending:'pill-pending', Accepted:'pill-accepted', Rejected:'pill-rejected', Cancelled:'pill-cancelled' }[r.status] || 'pill-cancelled';

    let contactHtml = '';
    if (r.status === 'Accepted') {
      contactHtml = '<div class="rc-contact">' +
        (r.alumniEmail ? '📧 <a href="mailto:' + escAttr(r.alumniEmail) + '">' + escHtml(r.alumniEmail) + '</a>' : '') +
        (r.alumniEmail && r.alumniPhone ? ' &nbsp;|&nbsp; ' : '') +
        (r.alumniPhone ? '📞 ' + escHtml(r.alumniPhone) : '') +
        '</div>';
    }

    let cancelBtn = '';
    if (r.status === 'Pending') {
      cancelBtn = '<button class="btn-cancel" onclick="cancelRequest(' + r.requestId + ', this)">Cancel</button>';
    }

    let viewProfileLink = '';
    if (r.status === 'Accepted') {
      viewProfileLink = ' &nbsp;<a href="alumni-detail.html?id=' + r.alumniUserId + '" style="font-size:.82rem;">View Profile</a>';
    }

    return '<div class="request-card" id="card-' + r.requestId + '">' +
      '<div class="rc-header">' +
        '<div>' +
          '<a href="alumni-detail.html?id=' + r.alumniUserId + '" class="alumni-name">' + escHtml(r.alumniName) + '</a>' +
          viewProfileLink +
          '<div class="rc-meta">Sent ' + date + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
          '<span class="status-pill ' + pillClass + '">' + r.status + '</span>' +
          cancelBtn +
        '</div>' +
      '</div>' +
      '<div class="rc-message">' + escHtml(r.message) + '</div>' +
      contactHtml +
    '</div>';
  }

  async function cancelRequest(requestId, btn) {
    if (!confirm('Cancel this mentorship request?')) return;
    btn.disabled = true;
    btn.textContent = 'Cancelling...';
    try {
      await apiFetch('/mentorship/' + requestId, { method: 'DELETE' });
      showToast('Request cancelled.', 'success');
      document.getElementById('card-' + requestId).remove();
      const remaining = document.querySelectorAll('.request-card').length;
      if (remaining === 0) {
        document.getElementById('list-area').innerHTML = '<div class="no-results">No pending requests.</div>';
      }
    } catch (err) {
      showToast(err.message || 'Failed to cancel.', 'error');
      btn.disabled = false;
      btn.textContent = 'Cancel';
    }
  }

  function renderPagination(total) {
    const pages = Math.ceil(total / PAGE_SIZE);
    if (pages <= 1) return;
    const bar = document.getElementById('pagination');
    let html = '';
    for (let i = 1; i <= pages; i++) {
      html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
    }
    bar.innerHTML = html;
  }

  function goPage(p) { currentPage = p; loadRequests(); }

  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escAttr(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</div>
</body>
</html>
