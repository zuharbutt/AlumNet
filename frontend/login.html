<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AlumniMS</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<nav style="background:#1a237e;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 24px;height:56px;">
  <a href="index.html" style="font-size:1.25rem;font-weight:700;color:#fff;text-decoration:none;">AlumniMS</a>
</nav>

<div class="page-center">
  <div class="form-card">
    <h2 style="margin-bottom:24px;text-align:center;">Sign In</h2>

    <div id="error-banner" class="error-msg" style="background:#fdecea;padding:10px;border-radius:6px;margin-bottom:16px;display:none;"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required />
        <div class="error-msg" id="email-error"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
        <div class="error-msg" id="password-error"></div>
      </div>

      <button type="submit" class="btn btn-primary" id="submit-btn">Login</button>
    </form>

    <p style="text-align:center;margin-top:18px;font-size:.9rem;">
      Don't have an account? <a href="register.html">Register here</a>
    </p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/validators.js"></script>
<script>
  // Redirect if already logged in
  if (isLoggedIn()) redirectToDashboard(getUser()?.role);

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    clearError('email-error');
    clearError('password-error');
    const banner = document.getElementById('error-banner');
    banner.style.display = 'none';

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!email)    { showError('email-error', 'Email is required.'); valid = false; }
    if (!password) { showError('password-error', 'Password is required.'); valid = false; }
    if (!valid) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Logging in…';

    try {
      const res = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });
      saveAuth(res.data);
      redirectToDashboard(res.data.role);
    } catch (err) {
      banner.textContent = err.message || 'Invalid credentials.';
      banner.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  });
</script>
</body>
</html>
